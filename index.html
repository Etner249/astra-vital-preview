<style>:root{
  --bg:#070b14; --bg2:#0b1220; --panel:#0f1828; --panel2:#132036; --line:#1f2e48; --line2:#2a3d5e;
  --txt:#e8eef8; --muted:#8fa3c2; --dim:#5f7394;
  --cyan:#36d6e7; --blue:#3b82f6; --accent:#7cc4ff;
  --ok:#3ccf91; --warn:#f2b440; --crit:#ff5d6c; --info:#7aa7ff;
  --radius:12px; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;line-height:1.45}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,#0a1222,#070b14);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:18px}
.brand svg{flex:none}
.brand b{display:block;letter-spacing:.14em;font-size:15px}
.brand small{color:var(--muted);font-size:10.5px;letter-spacing:.08em}
nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:500;margin-bottom:2px}
nav a svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
nav a:hover{background:var(--panel);color:var(--txt)}
nav a.active{background:var(--panel2);color:var(--txt);box-shadow:inset 3px 0 0 var(--cyan)}
nav .sep{font-size:10px;color:var(--dim);letter-spacing:.12em;margin:14px 10px 6px}
.disclaimer{font-size:11px;color:var(--dim);margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
main{min-width:0}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line);background:rgba(7,11,20,.9);backdrop-filter:blur(6px);position:sticky;top:0;z-index:5}
.topbar h1{font-size:17px;margin:0;font-weight:600}
.topbar .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);background:var(--bg2);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%}
.pill.demo{border-color:#5a4a1d;color:#f5d58a;background:#1d1708}
.content{padding:22px 24px 60px;max-width:1320px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3{margin:0 0 6px;font-size:15px}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .v{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:3px}
.kpi .l{color:var(--muted);font-size:12px}
.muted{color:var(--muted)} .dim{color:var(--dim)} .mono{font-family:var(--mono)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px;border:1px solid;white-space:nowrap}
.badge svg{width:12px;height:12px}
.b-ok{color:var(--ok);border-color:#1f5a43;background:#0b2219}
.b-followup{color:var(--warn);border-color:#6a5016;background:#231a07}
.b-priority{color:var(--crit);border-color:#6d2730;background:#2a0d12}
.b-info{color:var(--info);border-color:#2b4170;background:#0d1730}
.b-syn{color:#f5d58a;border-color:#5a4a1d;background:#1d1708}
.b-real{color:var(--cyan);border-color:#1b5a63;background:#06222a}
.status-hero{display:flex;gap:16px;align-items:center}
.status-ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;border:3px solid;flex:none}
.status-ring svg{width:34px;height:34px}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:550;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--cyan)}
.btn.primary{background:#0f5f8a;border-color:#2a8fc4}
.btn.primary:hover{background:#127aaf}
.btn.danger{border-color:#6d2730;color:#ffb3ba}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase}
td.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}
.tablewrap{overflow:auto;max-height:420px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:550}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:9px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(54,214,231,.15)}
.field{margin-bottom:12px}
.err{color:var(--crit);font-size:12px;margin-top:4px;min-height:1em}
.hint{color:var(--dim);font-size:11.5px;margin-top:4px}
.alert{border:1px solid var(--line);border-left:4px solid;border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--bg2)}
.alert.priority{border-left-color:var(--crit)} .alert.followup{border-left-color:var(--warn)} .alert.info{border-left-color:var(--info)}
.alert .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;cursor:pointer}
.alert dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:10px 0 0;font-size:13px}
.alert dt{color:var(--muted);font-weight:600}
.alert dd{margin:0}
.alert .src{font-size:11.5px;color:var(--dim);margin-top:8px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--sans)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:7px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--bg2);cursor:pointer;color:var(--muted);font-weight:550}
.tab.active{color:var(--txt);border-color:var(--cyan);background:#0c2633}
.body-wrap{display:grid;grid-template-columns:300px 1fr;gap:18px}
.body-svg .zone{cursor:pointer;transition:opacity .2s,filter .2s}
.body-svg .zone:hover{filter:brightness(1.35)}
.body-svg .zone:focus{outline:none;filter:brightness(1.5)}
.hazard{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--panel)}
.hazard .letter{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:18px;background:#0c2633;color:var(--cyan);border:1px solid #1b5a63;flex:none}
.hazard ul{margin:6px 0 0;padding-left:18px} .hazard li{margin-bottom:3px}
.check{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.check input{width:18px;height:18px;accent-color:var(--cyan)}
.progress{height:8px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .4s}
.toast{position:fixed;bottom:18px;right:18px;background:var(--panel2);border:1px solid var(--cyan);padding:11px 16px;border-radius:10px;z-index:50;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:in .25s ease}
@keyframes in{from{transform:translateY(10px);opacity:0}}
.fade{animation:fadein .3s ease} @keyframes fadein{from{opacity:0;transform:translateY(4px)}}
.log{font-family:var(--mono);font-size:12px;background:#050810;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:220px;overflow:auto;white-space:pre-wrap}
.ref{font-size:12.5px;margin-bottom:8px;padding-left:12px;border-left:2px solid var(--line2)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.empty{color:var(--dim);padding:18px;text-align:center;border:1px dashed var(--line2);border-radius:10px}
.menu-btn{display:none}
#report{display:none}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;z-index:20;width:250px;transform:translateX(-100%);transition:transform .25s}
  aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
  .menu-btn{display:inline-flex}
  .g2,.g3,.g4{grid-template-columns:1fr}.span2{grid-column:auto}
  .body-wrap{grid-template-columns:1fr}
  .content{padding:16px 14px 60px}.topbar{padding:12px 14px}
  .alert dl{grid-template-columns:1fr}
}
@media print{
  body{background:#fff;color:#000}
  .app{display:none}
  #report{display:block;color:#000;font-size:11pt;padding:10mm}
  #report table th,#report table td{border-bottom:1px solid #bbb;color:#000}
  #report h1,#report h2{color:#000}
}

.card h2 .btn{text-transform:none;letter-spacing:0;text-decoration:none;font-size:12px;padding:5px 10px;color:var(--txt)}
/* ---------- Academic edition: session, NASA Evaluator Access login, Mission Control ---------- */
.userbox{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;font-size:12px;display:flex;flex-direction:column;gap:3px;color:var(--muted)}
.userbox b{color:var(--txt);font-size:13px}.userbox .btn{margin-top:6px;justify-content:center}
.demo-tag{color:#f5d58a;font-weight:700;letter-spacing:.06em}
.astro-pick select{background:transparent;border:0;padding:0 2px;width:auto;color:var(--txt);font-weight:600}
.login-page{background:radial-gradient(1200px 700px at 70% 10%,#0e2546 0%,#070b14 55%,#04060c 100%);min-height:100vh}
.login-wrap{max-width:1040px;margin:0 auto;padding:32px 20px 28px}
.login-head{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:22px}
.login-head .brand{margin:0}.login-head .brand b{letter-spacing:.14em}
.login-head small{display:block;color:var(--muted);font-size:10.5px;letter-spacing:.08em}
.edition{font-size:11px;color:var(--cyan);letter-spacing:.12em;margin-top:2px}
.team-tag{font-size:12px;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:6px 12px;background:rgba(11,18,32,.7)}
.team-tag b{color:var(--cyan);letter-spacing:.06em}
.login-grid{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:18px;align-items:start}
.login-card h2,.evaluator h2{font-size:15px;margin:0 0 12px}
.btn.block{width:100%;justify-content:center;padding:10px 13px}
.btn.small{font-size:12px;padding:5px 10px}
.small{font-size:12.5px}
.flash{border:1px solid var(--line2);border-left:4px solid var(--info);background:var(--bg2);padding:9px 12px;border-radius:10px;margin-bottom:10px;font-size:13px}
.srv{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 11px;margin-bottom:12px;background:var(--bg2)}
.srv .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none;animation:pulse 1.2s infinite}
.srv.ok .dot{background:var(--ok);animation:none}.srv.bad .dot{background:var(--crit);animation:none}.srv.bad{color:#ffb3ba}
@keyframes pulse{50%{opacity:.35}}
.steps{margin:14px 0 8px;padding:12px 12px 12px 30px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);font-size:12.5px;color:var(--muted)}
.steps li{margin-bottom:4px}.steps b{color:var(--txt)}
.evaluator{border-color:#1f4f6b;box-shadow:0 0 0 1px rgba(54,214,231,.08),0 18px 50px rgba(0,0,0,.35)}
.eval-kicker{display:inline-block;font-size:10.5px;letter-spacing:.18em;font-weight:700;color:#04121a;background:var(--cyan);border-radius:4px;padding:3px 7px;margin-bottom:8px}
.demo-list{display:grid;gap:10px;margin-top:12px}
.demo-acc{border:1px solid var(--line2);border-left:4px solid var(--cyan);border-radius:10px;padding:10px 12px;background:var(--bg2)}
.demo-acc.role-doctor{border-left-color:#3ccf91}.demo-acc.role-operator{border-left-color:#f2b440}
.demo-acc.used{box-shadow:0 0 0 2px rgba(54,214,231,.45)}
.demo-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.role-badge{font-size:11.5px;font-weight:700;letter-spacing:.1em}
.role-admin .role-badge{color:var(--cyan)}.role-doctor .role-badge{color:#3ccf91}.role-operator .role-badge{color:#f2b440}
.demo-acc dl{display:grid;grid-template-columns:86px 1fr;gap:4px 8px;margin:0;align-items:center}
.demo-acc dt{font-size:11.5px;color:var(--dim)}
.demo-acc dd{margin:0;display:flex;gap:8px;align-items:center;min-width:0}
.demo-acc code{font-family:var(--mono);font-size:12.5px;color:var(--txt);background:#08101d;border:1px solid var(--line);border-radius:6px;padding:3px 7px;overflow-wrap:anywhere}
.copy{flex:none;font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;color:var(--muted)}
.copy:hover{border-color:var(--cyan);color:var(--txt)}.copy.ok{border-color:var(--ok);color:var(--ok)}
.demo-acc .perm{font-size:12px;color:var(--muted);margin:7px 0 0}
.demo-warning{margin-top:12px;border:1px solid #5a4a1d;border-left:4px solid var(--warn);background:#1d1708;color:#f5e2b0;border-radius:10px;padding:10px 12px;font-size:12.5px}
@media (max-width:820px){.login-grid{grid-template-columns:1fr}.login-head{justify-content:center;text-align:center}}
</style>
</head>

  const validRecords = () => S.records.filter(r => E.checkQuality(r).ok);

  /* ---------------- Charts (SVG, no external libs) ---------------- */
  function lineChart(seriesList, opts) {
    opts = opts || {}; const W = opts.w || ((opts.h || 200) <= 180 ? 460 : 640), H = opts.h || 200, P = { l: 40, r: 12, t: 12, b: 24 };
    const pts = seriesList.flatMap(s => s.points); if (!pts.length) return '<div class="empty">No data yet</div>';
    let tMin = Math.min(...pts.map(p => p.t)), tMax = Math.max(...pts.map(p => p.t)); if (tMin === tMax) { tMin -= DAY; tMax += DAY; }
    const vals = pts.map(p => p.v).concat(opts.band ? opts.band : []);
    let vMin = Math.min(...vals), vMax = Math.max(...vals); const pad = (vMax - vMin) * 0.12 || 1; vMin -= pad; vMax += pad;
    const x = t => P.l + (t - tMin) / (tMax - tMin) * (W - P.l - P.r);
    const y = v => H - P.b - (v - vMin) / (vMax - vMin) * (H - P.t - P.b);
    let g = '';
    if (opts.band) { const [a, b] = opts.band; g += `<rect x="${P.l}" y="${y(b)}" width="${W - P.l - P.r}" height="${Math.max(1, y(a) - y(b))}" fill="rgba(60,207,145,.08)" stroke="rgba(60,207,145,.35)" stroke-dasharray="3 3"/>`; g += `<text x="${W - P.r - 4}" y="${y(b) - 3}" text-anchor="end">${esc(opts.bandLabel || 'reference')}</text>`; }
    for (let i = 0; i <= 4; i++) { const v = vMin + (vMax - vMin) * i / 4; g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="#1a2740"/><text x="${P.l - 6}" y="${y(v) + 3}" text-anchor="end">${(+v.toFixed(Math.abs(vMax - vMin) < 8 ? 1 : 0))}</text>`; }
    const ticks = opts.labels || [0, 0.5, 1].map(f => ({ t: tMin + f * (tMax - tMin), l: opts.tfmt ? opts.tfmt(tMin + f * (tMax - tMin)) : 'Day ' + missionDay(tMin + f * (tMax - tMin)) }));
    ticks.forEach((k, i) => { const anc = i === 0 ? 'start' : i === ticks.length - 1 ? 'end' : 'middle'; g += `<text x="${x(k.t)}" y="${H - 6}" text-anchor="${anc}">${esc(k.l)}</text>`; });
    seriesList.forEach(s => {
      if (!s.points.length) return;
      const d = s.points.map((p, i) => `${i ? 'L' : 'M'}${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
      g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" ${s.dash ? 'stroke-dasharray="5 4"' : ''} stroke-linejoin="round"/>`;
      s.points.forEach(p => { const out = opts.band && (p.v < opts.band[0] || p.v > opts.band[1]); g += `<circle cx="${x(p.t).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${out ? 4 : 2.6}" fill="${out ? '#f2b440' : s.color}" stroke="#070b14" stroke-width="1"><title>${esc(s.label || '')} ${p.v} ${esc(opts.unit || '')} — ${esc(p.lab || fmtTime(p.t))}</title></circle>`; });
    });
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || 'chart')}">${g}</svg>`;
  }
  function metricChart(metric, h) {
    const m = M[metric]; const s1 = E.series(S.records, metric);

    if (m.dual) list.push({ points: E.series(S.records, metric, 'value2'), color: '#7aa7ff', label: 'Diastolic', dash: true });

  function spark(metric) {

    return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="30" aria-hidden="true"><path d="${d}" fill="none" stroke="#36d6e7" stroke-width="1.6"/></svg>`;

    syncing = (async () => {
      const BATCH = 5; let sent = 0, rejected = 0, batches = 0, newAlerts = 0;
      while (S.queue.length && S.link === 'AOS') {
        if (S.dropNext && batches >= 1) { S.dropNext = false; S.link = 'LOS'; log(`Link dropped during transfer after ${sent} records. ${S.queue.length} remain queued; transfer will resume at next AOS.`); break; }
        const ids = S.queue.slice(0, BATCH); batches++;
        for (const id of ids) {
          const r = S.records.find(x => x.id === id);
          if (!r) { S.queue = S.queue.filter(q => q !== id); continue; }
          try {
            const res = await api('/measurements', { method: 'POST', body: toServer(r) });

            <div class="field"><label for="password">Contraseña · Password</label><input id="password" name="password" type="password" autocomplete="current-password"></div>
            <div class="err" id="lerr" role="alert"></div><button class="btn primary block" id="lbtn" type="submit">Ingresar</button></form>
          <ol class="steps" aria-label="Cómo ingresar"><li>Elige una cuenta de la sección <b>NASA Evaluator Access</b>.</li><li>Pulsa <b>Usar esta cuenta</b> (o copia el correo y la contraseña).</li><li>Pulsa <b>Ingresar</b>. Cada cuenta abre ASTRA VITAL con los permisos reales de su rol.</li></ol>
          <p class="hint">Primera carga: el servidor gratuito de Render puede tardar hasta ~50 s en despertar. Versión enviada a la NASA (15/11/2026, sin cambios): <a href="nasa-2026/">/astra-vital/nasa-2026/</a></p>
        </section>
        <section class="card evaluator" aria-labelledby="eval-h"><div class="eval-kicker">NASA EVALUATOR ACCESS</div><h2 id="eval-h">Credenciales de demostración</h2>
          <p class="muted small">Tres cuentas públicas, una por rol, para docentes, evaluadores y jurados de NASA Space Apps. Las credenciales las entrega el servidor.</p>
          <div class="demo-list" id="demo"><div class="empty">Cargando cuentas desde el servidor…</div></div>
          <div class="demo-warning" role="note"><b>Cuentas públicas de demostración.</b> Cualquier persona puede usarlas: no ingreses datos personales, médicos ni reales. Todos los astronautas y signos vitales son sintéticos y la base de datos se restablece cuando el servidor se reinicia. Por seguridad estas cuentas no pueden gestionar usuarios ni borrar los datos de referencia.</div>
        </section></div>
      <p class="disclaimer" style="text-align:center">Prototype for the 2026 NASA Space Apps Challenge by team NYXARA NOVA — academic edition with Flask + SQLite backend. Not an official NASA product. Not a medical device.</p></div></div>`;
    const srv = $('#srv');
    const setSrv = (ok, txt) => { srv.className = 'srv ' + (ok === true ? 'ok' : ok === false ? 'bad' : ''); srv.lastElementChild.textContent = txt; };
    if (!API_BASE) setSrv(false, 'Build error: API URL not configured.');
    const t0 = Date.now(); const slow = setTimeout(() => setSrv(null, 'Despertando el servidor gratuito de Render… (hasta ~50 s)'), 4000);
    api('/health', { anon: true }).then(() => { clearTimeout(slow); setSrv(true, `Servidor en línea (${((Date.now() - t0) / 1000).toFixed(1)} s)`); return api('/demo-accounts', { anon: true }); })
      .then(d => renderDemo(d.accounts)).catch(e => { clearTimeout(slow); setSrv(false, 'No se pudo contactar al servidor: ' + e.message + ' Recarga la página para reintentar.'); $('#demo').innerHTML = '<div class="empty">Las cuentas se muestran cuando el servidor responde.</div>'; });
    $('#lf').onsubmit = async e => {
      e.preventDefault(); const email = $('#email').value.trim(), password = $('#password').value;
      if (!email || !password) { $('#lerr').textContent = 'Ingresa correo y contraseña.'; return; }
      $('#lbtn').disabled = true; $('#lbtn').textContent = 'Ingresando…'; $('#lerr').textContent = '';
      try {
        const r = await api('/auth/login', { method: 'POST', body: { email, password }, anon: true });
        SESSION.token = r.token; SESSION.user = r.user; SESSION.ended = false; ssSet(TOKEN_KEY, r.token);
        await startApp();
      } catch (err) { $('#lerr').textContent = err.status === 401 ? 'Correo o contraseña incorrectos.' : errText(err); $('#lbtn').disabled = false; $('#lbtn').textContent = 'Ingresar'; }
    };
  }
  function renderDemo(accounts) {
    const box = $('#demo'); if (!box) return;
    if (!accounts || !accounts.length) { box.innerHTML = '<div class="empty">Las cuentas de demostración están desactivadas en este servidor.</div>'; return; }
    box.innerHTML = accounts.map(a => `<article class="demo-acc role-${esc(a.role)}"><div class="demo-top"><span class="role-badge">${esc(a.label)}</span><button type="button" class="btn small use-acc">Usar esta cuenta</button></div>
      <dl><dt>Correo</dt><dd><code>${esc(a.email)}</code><button type="button" class="copy" data-copy="${esc(a.email)}" aria-label="Copiar correo de ${esc(a.label)}">Copiar</button></dd>
      <dt>Contraseña</dt><dd><code>${esc(a.password)}</code><button type="button" class="copy" data-copy="${esc(a.password)}" aria-label="Copiar contraseña de ${esc(a.label)}">Copiar</button></dd></dl><p class="perm">${esc(a.can)}</p></article>`).join('');
    $$('.demo-acc', box).forEach((card, i) => { $('.use-acc', card).onclick = () => { $('#email').value = accounts[i].email; $('#password').value = accounts[i].password; $$('.demo-acc', box).forEach(c => c.classList.remove('used')); card.classList.add('used'); $('#lbtn').focus(); }; });
    $$('button.copy', box).forEach(b => b.onclick = () => copyText(b.dataset.copy).then(ok => { const old = b.textContent; b.textContent = ok ? 'Copiado ✓' : 'Copia manual'; b.classList.toggle('ok', ok); setTimeout(() => { b.textContent = old; b.classList.remove('ok'); }, 1600); }));
  }
  function copyText(text) {
    const fallback = () => { const t = document.createElement('textarea'); t.value = text; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; } t.remove(); return ok; };
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(() => true, () => fallback());
    return Promise.resolve(fallback());
  }

  async function startApp() {
    const root = document.getElementById('root');
    if (!$('.app', root)) root.innerHTML = `<div class="login-page"><div class="login-wrap"><div class="card" style="max-width:420px;margin:80px auto;text-align:center">${symbol(54)}<p>Cargando ASTRA VITAL desde el servidor…</p></div></div></div>`;
    try {
      if (!SESSION.user) SESSION.user = (await api('/auth/me')).user;
      SESSION.astronauts = (await api('/astronauts')).items;
      if (!SESSION.astronauts.length && !can('astronauts.manage')) throw new Error('No astronauts are registered yet. Ask an Administrator to create one.');
      const stored = Number(ssGet(ASTRO_KEY));
      await selectAstronaut(SESSION.astronauts.some(a => a.id === stored) ? stored : (SESSION.astronauts[0] || {}).id, true);
      document.title = 'ASTRA VITAL — Astronaut Health Monitoring | NYXARA NOVA';
      shell(); window.removeEventListener('hashchange', route); window.addEventListener('hashchange', route); route();
      if (S.queue.length && S.link === 'AOS') syncNow(true);
    } catch (e) { if (!SESSION.ended) endSession(e.network ? 'No se pudo contactar al servidor. ' + e.message : errText(e)); }
  }
  async function loadServerRecords(id) { return fromServer((await api(`/measurements?astronaut_id=${id}&limit=2000`)).items); }
  async function selectAstronaut(id, silent) {
    if (!id) { SESSION.astronauts = (await api('/astronauts')).items; id = (SESSION.astronauts[0] || {}).id; }
    if (!id) { SESSION.astronaut = { id: 0, code: '—', full_name: 'No astronauts', mission: null, is_synthetic: false }; S = buildState([]); return; }
    const [a, recs] = await Promise.all([api('/astronauts/' + id), loadServerRecords(id)]);
    SESSION.astronaut = a.item; SESSION.astronauts = SESSION.astronauts.map(x => x.id === a.item.id ? a.item : x);
    ssSet(ASTRO_KEY, String(id));
    S = buildState(recs);
    if (S.routine.date !== fmtDate(Date.now())) S.routine = { date: fmtDate(Date.now()), done: [] };
    save();
    if (!silent) { refresh(); toast(`Showing ${esc(a.item.code)} — ${esc(a.item.full_name)}.`); }
  }
  async function reloadAstronautData() {
    const recs = await loadServerRecords(SESSION.astronaut.id);
    const pending = S.records.filter(r => S.queue.includes(r.id));
    S.records = recs.concat(pending); S.ground.records = recs.map(r => Object.assign({}, r));
    S.ground.receivedAt = recs.length ? Math.max.apply(null, recs.map(r => r.ts)) : S.ground.receivedAt;
    const a = await api('/astronauts/' + SESSION.astronaut.id); SESSION.astronaut = a.item;
  }
  function endSession(message) {
    if (SESSION.ended) return; SESSION.ended = true;
    if (S) save();
    SESSION.token = null; SESSION.user = null; SESSION.astronaut = null; S = null; ssSet(TOKEN_KEY, null);
    window.removeEventListener('hashchange', route); renderLogin(message);
  }
  async function logout() {
    try { await api('/auth/logout', { method: 'POST' }); } catch (e) { /* token may already be invalid */ }
    endSession('Sesión cerrada. Los registros pendientes quedan guardados en este dispositivo.');
  }

  /* ---------------- Boot ---------------- */
  SESSION.token = ssGet(TOKEN_KEY);
  if (SESSION.token) startApp(); else renderLogin();
  window.AV = { get state() { return S; }, get session() { return { user: SESSION.user, astronaut: SESSION.astronaut }; }, engine: E, syncNow, csv, reportHtml };

})();
</script>
</body>
</html>
