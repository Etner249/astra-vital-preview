<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASTRA VITAL — Astronaut Health Monitoring | NYXARA NOVA</title>
<meta name="description" content="ASTRA VITAL: offline-first, explainable health monitoring for astronauts on long-duration missions. NASA Space Apps Challenge 2026 — team NYXARA NOVA.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2040%2040%22%20width%3D%2264%22%20height%3D%2264%22%3E%3Ctitle%3EASTRA%20VITAL%3C/title%3E%3Crect%20width%3D%2240%22%20height%3D%2240%22%20rx%3D%229%22%20fill%3D%22%23070B14%22/%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%2220%22%20r%3D%2218%22%20fill%3D%22none%22%20stroke%3D%22%2336D6E7%22%20stroke-width%3D%221.5%22/%3E%3Cellipse%20cx%3D%2220%22%20cy%3D%2220%22%20rx%3D%2218%22%20ry%3D%226%22%20fill%3D%22none%22%20stroke%3D%22%233B82F6%22%20stroke-width%3D%221.2%22%20transform%3D%22rotate%28-25%2020%2020%29%22/%3E%3Cpath%20d%3D%22M8%2021h6l3-7%204%2013%203-9%202%203h6%22%20fill%3D%22none%22%20stroke%3D%22%23E8EEF8%22%20stroke-width%3D%222%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E">
<meta name="theme-color" content="#070B14">
<style>:root{
  --bg:#070b14; --bg2:#0b1220; --panel:#0f1828; --panel2:#132036; --line:#1f2e48; --line2:#2a3d5e;
  --txt:#e8eef8; --muted:#8fa3c2; --dim:#5f7394;
  --cyan:#36d6e7; --blue:#3b82f6; --accent:#7cc4ff;
  --ok:#3ccf91; --warn:#f2b440; --crit:#ff5d6c; --info:#7aa7ff;
  --radius:12px; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;line-height:1.45}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,#0a1222,#070b14);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:18px}
.brand svg{flex:none}
.brand b{display:block;letter-spacing:.14em;font-size:15px}
.brand small{color:var(--muted);font-size:10.5px;letter-spacing:.08em}
nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:500;margin-bottom:2px}
nav a svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
nav a:hover{background:var(--panel);color:var(--txt)}
nav a.active{background:var(--panel2);color:var(--txt);box-shadow:inset 3px 0 0 var(--cyan)}
nav .sep{font-size:10px;color:var(--dim);letter-spacing:.12em;margin:14px 10px 6px}
.disclaimer{font-size:11px;color:var(--dim);margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
main{min-width:0}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line);background:rgba(7,11,20,.9);backdrop-filter:blur(6px);position:sticky;top:0;z-index:5}
.topbar h1{font-size:17px;margin:0;font-weight:600}
.topbar .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);background:var(--bg2);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%}
.pill.demo{border-color:#5a4a1d;color:#f5d58a;background:#1d1708}
.content{padding:22px 24px 60px;max-width:1320px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3{margin:0 0 6px;font-size:15px}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .v{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:3px}
.kpi .l{color:var(--muted);font-size:12px}
.muted{color:var(--muted)} .dim{color:var(--dim)} .mono{font-family:var(--mono)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px;border:1px solid;white-space:nowrap}
.badge svg{width:12px;height:12px}
.b-ok{color:var(--ok);border-color:#1f5a43;background:#0b2219}
.b-followup{color:var(--warn);border-color:#6a5016;background:#231a07}
.b-priority{color:var(--crit);border-color:#6d2730;background:#2a0d12}
.b-info{color:var(--info);border-color:#2b4170;background:#0d1730}
.b-syn{color:#f5d58a;border-color:#5a4a1d;background:#1d1708}
.b-real{color:var(--cyan);border-color:#1b5a63;background:#06222a}
.status-hero{display:flex;gap:16px;align-items:center}
.status-ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;border:3px solid;flex:none}
.status-ring svg{width:34px;height:34px}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:550;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--cyan)}
.btn.primary{background:#0f5f8a;border-color:#2a8fc4}
.btn.primary:hover{background:#127aaf}
.btn.danger{border-color:#6d2730;color:#ffb3ba}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase}
td.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}
.tablewrap{overflow:auto;max-height:420px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:550}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:9px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(54,214,231,.15)}
.field{margin-bottom:12px}
.err{color:var(--crit);font-size:12px;margin-top:4px;min-height:1em}
.hint{color:var(--dim);font-size:11.5px;margin-top:4px}
.alert{border:1px solid var(--line);border-left:4px solid;border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--bg2)}
.alert.priority{border-left-color:var(--crit)} .alert.followup{border-left-color:var(--warn)} .alert.info{border-left-color:var(--info)}
.alert .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;cursor:pointer}
.alert dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:10px 0 0;font-size:13px}
.alert dt{color:var(--muted);font-weight:600}
.alert dd{margin:0}
.alert .src{font-size:11.5px;color:var(--dim);margin-top:8px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--sans)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:7px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--bg2);cursor:pointer;color:var(--muted);font-weight:550}
.tab.active{color:var(--txt);border-color:var(--cyan);background:#0c2633}
.body-wrap{display:grid;grid-template-columns:300px 1fr;gap:18px}
.body-svg .zone{cursor:pointer;transition:opacity .2s,filter .2s}
.body-svg .zone:hover{filter:brightness(1.35)}
.body-svg .zone:focus{outline:none;filter:brightness(1.5)}
.hazard{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--panel)}
.hazard .letter{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:18px;background:#0c2633;color:var(--cyan);border:1px solid #1b5a63;flex:none}
.hazard ul{margin:6px 0 0;padding-left:18px} .hazard li{margin-bottom:3px}
.check{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.check input{width:18px;height:18px;accent-color:var(--cyan)}
.progress{height:8px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .4s}
.toast{position:fixed;bottom:18px;right:18px;background:var(--panel2);border:1px solid var(--cyan);padding:11px 16px;border-radius:10px;z-index:50;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:in .25s ease}
@keyframes in{from{transform:translateY(10px);opacity:0}}
.fade{animation:fadein .3s ease} @keyframes fadein{from{opacity:0;transform:translateY(4px)}}
.log{font-family:var(--mono);font-size:12px;background:#050810;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:220px;overflow:auto;white-space:pre-wrap}
.ref{font-size:12.5px;margin-bottom:8px;padding-left:12px;border-left:2px solid var(--line2)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.empty{color:var(--dim);padding:18px;text-align:center;border:1px dashed var(--line2);border-radius:10px}
.menu-btn{display:none}
#report{display:none}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;z-index:20;width:250px;transform:translateX(-100%);transition:transform .25s}
  aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
  .menu-btn{display:inline-flex}
  .g2,.g3,.g4{grid-template-columns:1fr}.span2{grid-column:auto}
  .body-wrap{grid-template-columns:1fr}
  .content{padding:16px 14px 60px}.topbar{padding:12px 14px}
  .alert dl{grid-template-columns:1fr}
}
@media print{
  body{background:#fff;color:#000}
  .app{display:none}
  #report{display:block;color:#000;font-size:11pt;padding:10mm}
  #report table th,#report table td{border-bottom:1px solid #bbb;color:#000}
  #report h1,#report h2{color:#000}
}

.card h2 .btn{text-transform:none;letter-spacing:0;text-decoration:none;font-size:12px;padding:5px 10px;color:var(--txt)}
</style>

<script>/* ASTRA VITAL — Health Intelligence Engine (rule-based, explainable)
 * Team NYXARA NOVA — NASA Space Apps Challenge 2026
 * No machine-learning model is used. Every alert is produced by an explicit,
 * documented rule so the astronaut can see exactly why it fired.
 * This software is a prototype. It does NOT diagnose and does NOT replace a flight surgeon.
 */
(function (root) {
  'use strict';
  const DAY = 86400000;

  // Reference sources (shown in-app and in reports)
  const SOURCES = {
    AHA_HR: 'American Heart Association — normal resting heart rate for adults is 60–100 bpm.',
    ACC_AHA_BP: '2017 ACC/AHA Hypertension Guideline (Whelton et al., Hypertension 2018) — Normal <120/<80; Elevated 120–129/<80; Stage 1 130–139 or 80–89; Stage 2 ≥140 or ≥90; Hypertensive crisis >180 and/or >120 mmHg.',
    SPO2: 'Typical SpO2 in healthy adults at sea-level pressure is 95–100%; SpO2 <90% is the commonly used threshold for hypoxemia (e.g., WHO Pulse Oximetry Training Manual, 2011).',
    CDC_FEVER: 'CDC — a person with a measured temperature of 100.4 °F (38.0 °C) or greater is considered to have a fever.',
    AASM_SLEEP: 'AASM/SRS consensus (Watson et al., Sleep 2015) — adults should sleep 7 or more hours per night on a regular basis.',
    BARGER_2014: 'Barger et al., Lancet Neurology 2014 — astronauts averaged about 6 h of sleep per night on ISS missions.',
    NASA_EXERCISE: 'NASA — ISS crew members exercise about 2 hours per day (resistive + aerobic) to counter bone and muscle loss.',
    NASA_BONE: 'NASA Human Research Program — on average, bones lose 1%–1.5% of their density each month during 4–6-month missions.',
    SAMN_PERELLI: 'Samn-Perelli 7-point fatigue scale (Samn & Perelli, USAF SAM 1982); scores of 5–7 indicate moderate-to-extreme fatigue in fatigue-risk management practice.',
    ADA_GLUCOSE: 'American Diabetes Association Standards of Care — Level 1 hypoglycemia <70 mg/dL; Level 2 <54 mg/dL; normal fasting glucose 70–99 mg/dL.',
    NASA_HRP: 'NASA Human Research Program — five hazards of human spaceflight (RIDGE): Radiation, Isolation & confinement, Distance from Earth, Gravity fields, Hostile/closed environments.',
    ENGINE: 'ASTRA VITAL engine convention (engineering rule, not a clinical threshold).'
  };

  // Metric catalogue. hazard keys: R, I, D, G, E
  const METRICS = {
    hr:      { label: 'Heart rate', unit: 'bpm', system: 'cardio', ref: [60, 100], src: 'AHA_HR', plaus: [25, 230], sdFloor: 3, worse: 'both', hazards: ['G', 'I', 'R'] },
    bp:      { label: 'Blood pressure', unit: 'mmHg', system: 'cardio', ref: [90, 120], src: 'ACC_AHA_BP', plaus: [60, 260], sdFloor: 4, worse: 'up', hazards: ['G', 'E'], dual: true },
    spo2:    { label: 'Oxygen saturation', unit: '%', system: 'general', ref: [95, 100], src: 'SPO2', plaus: [60, 100], sdFloor: 0.7, worse: 'down', hazards: ['E'] },
    temp:    { label: 'Body temperature', unit: '°C', system: 'immune', ref: [36.1, 37.2], src: 'CDC_FEVER', plaus: [32, 43], sdFloor: 0.2, worse: 'up', hazards: ['E', 'R'] },
    sleep:   { label: 'Sleep duration', unit: 'h', system: 'nervous', ref: [7, 9], src: 'AASM_SLEEP', plaus: [0, 16], sdFloor: 0.4, worse: 'down', hazards: ['I', 'E'] },
    activity:{ label: 'Exercise completed', unit: 'min', system: 'musculo', ref: [120, 180], src: 'NASA_EXERCISE', plaus: [0, 400], sdFloor: 10, worse: 'down', hazards: ['G'] },
    fatigue: { label: 'Fatigue (Samn-Perelli 1–7)', unit: 'score', system: 'nervous', ref: [1, 4], src: 'SAMN_PERELLI', plaus: [1, 7], sdFloor: 0.8, worse: 'up', hazards: ['I', 'E'] },
    mood:    { label: 'Mood / well-being (1–5)', unit: 'score', system: 'nervous', ref: [3, 5], src: 'ENGINE', plaus: [1, 5], sdFloor: 0.5, worse: 'down', hazards: ['I', 'D'] },
    glucose: { label: 'Blood glucose', unit: 'mg/dL', system: 'general', ref: [70, 99], src: 'ADA_GLUCOSE', plaus: [20, 600], sdFloor: 6, worse: 'both', hazards: ['G', 'E'] }

  const ACTIONS = {

    bp: 'Re-measure after 5 minutes seated, back supported, same arm, cuff at heart level (AHA measurement technique). Take 2 readings 1 minute apart and log the average.',
    spo2: 'Re-measure: warm the finger, keep still, check sensor placement. Check cabin O2/CO2 readouts. If confirmed below 90% or with breathlessness/confusion, follow the onboard emergency medical checklist.',
    temp: 'Re-measure in 15 minutes. Log symptoms. Hydrate and rest. Follow onboard medical checklist for fever and inform the crew medical officer.',

  function mean(a) { return a.reduce((s, x) => s + x, 0) / (a.length || 1); }
  function sd(a) { const m = mean(a); return Math.sqrt(mean(a.map(x => (x - m) ** 2))); }
  function slopePerDay(points) { // least squares, t in ms
    if (points.length < 3) return 0;
    const t0 = points[0].t; const xs = points.map(p => (p.t - t0) / DAY); const ys = points.map(p => p.v);
    const mx = mean(xs), my = mean(ys);
    const num = xs.reduce((s, x, i) => s + (x - mx) * (ys[i] - my), 0);
    const den = xs.reduce((s, x) => s + (x - mx) ** 2, 0);
    return den ? num / den : 0;
  }

  // Quality check — physiological plausibility (engineering bounds) + internal consistency
  function checkQuality(r) {
    const m = METRICS[r.metric]; if (!m) return { ok: false, reason: 'Unknown indicator' };
    const v = Number(r.value);
    if (r.value === '' || r.value === null || isNaN(v)) return { ok: false, reason: 'Missing value' };
    if (v < m.plaus[0] || v > m.plaus[1]) return { ok: false, reason: `Value ${v} ${m.unit} is outside the physiologically plausible range (${m.plaus[0]}–${m.plaus[1]})` };
    if (m.dual) {
      const d = Number(r.value2);
      if (isNaN(d) || d < 30 || d > 160) return { ok: false, reason: 'Diastolic value missing or implausible' };
      if (d >= v) return { ok: false, reason: 'Diastolic pressure must be lower than systolic' };
    }
    return { ok: true };
  }

  function series(records, metric, key) {
    return records.filter(r => r.metric === metric && checkQuality(r).ok)
      .map(r => ({ t: r.ts, v: Number(key === 'value2' ? r.value2 : r.value), id: r.id }))
      .sort((a, b) => a.t - b.t);
  }

  // Personal baseline: first 7 valid values (the mission's early, stable period)
  function baseline(records, metric, key) {
    const s = series(records, metric, key); if (s.length < 5) return null;
    const vals = s.slice(0, 7).map(p => p.v);
    return { mean: mean(vals), sd: Math.max(sd(vals), (key === 'value2' ? 3 : METRICS[metric].sdFloor)), n: vals.length };
  }

  function fmt(v, metric) { const d = ['temp', 'spo2', 'sleep'].includes(metric) ? 1 : 0; return Number(v).toFixed(d); }

  function analyze(records, now) {

    // 1) Data quality
    records.forEach(r => {

        changed: `Latest value ${m.dual ? v + '/' + v2 : fmt(v, metric)} ${m.unit} (${new Date(last.t).toISOString().slice(0, 16).replace('T', ' ')} UTC).`,

    if (!S.queue.length && !S.ground.notes.filter(n => !n.delivered).length) { log('Sync: nothing to send.'); refresh(); return; }
    const BATCH = 5; let sent = 0;
    while (S.queue.length) {
      if (S.dropNext && sent >= BATCH) { S.dropNext = false; S.link = 'LOS'; log(`Link dropped during transfer after ${sent} records. ${S.queue.length} remain queued; transfer will resume at next AOS.`); break; }
      const ids = S.queue.slice(0, BATCH); const batch = S.records.filter(r => ids.includes(r.id));
      const res = E.mergeInto(S.ground.records, batch); S.ground.records = res.records; S.ground.receivedAt = Date.now();
      res.result.conflicts.forEach(c => log(`Conflict on ${c.id}: ground copy differs — kept ground copy, crew copy re-queued for review.`));
      const conflictIds = res.result.conflicts.map(c => c.id);
      S.queue = S.queue.filter(id => !ids.includes(id) || conflictIds.includes(id));
      sent += ids.length - conflictIds.length; save(); // persisted after every batch → resumes after interruption
      if (conflictIds.length && conflictIds.length === ids.length) break;
    }
    // downlink: notes from ground
    const notes = S.ground.notes.filter(n => !n.delivered); notes.forEach(n => { n.delivered = true; S.inbox.push(n); });

    log(`Uplink: ${sent} record(s) confirmed by ground store. Downlink: ${notes.length} flight-surgeon note(s).`);

  }

        <div class="hint">Reset replaces all local records with the synthetic demo set (click twice to confirm).</div></div>
      <div class="card span2"><h2>All records (${S.records.length})</h2>${recordsTable(S.records.slice().sort((a, b) => b.ts - a.ts))}</div></div>`;
    $('#link').onclick = () => { S.link = los ? 'AOS' : 'LOS'; log(los ? 'Communication window opened (AOS).' : 'Loss of signal (LOS).'); if (los) S.lastContact = Date.now(); refresh(); };
    $('#sync').onclick = syncNow;
    $('#drop').onchange = e => { S.dropNext = e.target.checked; save(); };
    $('#pdf').onclick = () => { $('#report').innerHTML = reportHtml(); try { window.print(); } catch (e) { toast('Printing is blocked here — use "Download report (.html)" and print it.'); } };
    $('#html').onclick = () => download(`astra-vital-report-${fmtDate(Date.now())}.html`, `<!doctype html><meta charset="utf-8"><title>ASTRA VITAL report</title><body style="font-family:Arial;max-width:900px;margin:auto;padding:20px">${reportHtml()}</body>`, 'text/html');
    $('#csv').onclick = () => download(`astra-vital-records-${fmtDate(Date.now())}.csv`, csv(), 'text/csv');
    $('#json').onclick = () => download(`astra-vital-backup-${fmtDate(Date.now())}.json`, JSON.stringify(S, null, 1), 'application/json');
    $('#restore').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { try { const d = JSON.parse(t); if (!d.records || !d.profile) throw new Error('Not an ASTRA VITAL backup'); S = d; refresh(); toast('Backup restored.'); } catch (err) { toast('Could not restore: ' + esc(err.message)); } }); };
    let armed = false;
    $('#reset').onclick = () => { if (!armed) { armed = true; $('#reset').textContent = 'Click again to confirm reset'; setTimeout(() => { armed = false; const b = $('#reset'); if (b) b.textContent = 'Reset demo data'; }, 4000); return; } S = freshState(); refresh(); toast('Demo data restored.'); };
    const copy = (txt, what) => { try { navigator.clipboard.writeText(txt).then(() => toast(what + ' copied to clipboard.'), () => toast('Clipboard blocked by this viewer.')); } catch (e) { toast('Clipboard not available here.'); } };
    $('#ccsv').onclick = () => copy(csv(), 'CSV');
    $('#crep').onclick = () => { const d = document.createElement('div'); d.innerHTML = reportHtml(); copy(d.innerText, 'Report'); };
  };

  /* ---- Ground console ---- */
  VIEWS.ground = el => {
    const gr = S.ground.records; const a = E.analyze(gr, Date.now());
    el.innerHTML = `<div class="card" style="margin-bottom:16px"><h2>Flight surgeon console (Earth side)</h2><div class="muted">This view only sees what has actually been synchronized. Records still queued on the spacecraft are not visible here — this shows the effect of communication gaps.</div></div>
    <div class="grid g4"><div class="card kpi"><div class="l">Records received</div><div class="v">${gr.length}</div></div><div class="card kpi"><div class="l">Pending on spacecraft</div><div class="v">${S.queue.length}</div></div><div class="card kpi"><div class="l">Last data received</div><div class="v" style="font-size:15px">${fmtTime(S.ground.receivedAt)}</div></div><div class="card kpi"><div class="l">Ground-side status</div><div class="v" style="font-size:18px">${badge(E.status(a))}</div></div></div>
    <div class="grid g2" style="margin-top:16px"><div class="card"><h2>Alerts computed from received data</h2>${a.filter(x => x.level !== 'info').map(alertHtml).join('') || '<div class="empty">None</div>'}</div>
    <div class="card"><h2>Send a note to the crew</h2><div class="field"><label for="gn">Note (delivered at next sync)</label><textarea id="gn" rows="3" maxlength="300" placeholder="e.g., Reviewed sleep trend — let's discuss at Friday's PMC."></textarea></div><div class="err" id="gerr"></div><button class="btn primary" id="gsend">Queue note for uplink</button>
      <h2 style="margin-top:16px">Notes</h2>${S.ground.notes.map(n => `<div class="ref">${esc(n.text)}<br><span class="dim">${fmtTime(n.ts)} · ${n.delivered ? 'delivered to crew' : 'waiting for next sync'}</span></div>`).join('') || '<div class="empty">No notes yet.</div>'}</div></div>`;
    bindAlerts(el);
    $('#gsend').onclick = () => { const t = $('#gn').value.trim(); if (t.length < 3) { $('#gerr').textContent = 'Write a note first.'; return; } S.ground.notes.push({ id: uid(), text: t, ts: Date.now(), delivered: false }); refresh(); toast('Note queued. It reaches the crew at the next sync.'); };
  };

  /* ---- About ---- */
  VIEWS.about = el => {
    el.innerHTML = `<div class="grid g2">
    <div class="card"><div class="row" style="gap:16px;margin-bottom:14px">${symbol(64)}<div><div style="font-size:24px;font-weight:700;letter-spacing:.14em">ASTRA VITAL</div><div class="muted" style="font-size:12px;letter-spacing:.1em">INTELLIGENT ASTRONAUT HEALTH MONITORING SYSTEM · BY NYXARA NOVA</div></div></div><h2>About the project</h2>
      <p style="margin-top:0">Built by team <b>NYXARA NOVA</b> (Trujillo, Peru) for the 2026 NASA Space Apps Challenge "Create Health Monitoring Software for Astronauts on Space Missions". <i>We control the unseen.</i></p>
      <p>Goal: help astronauts log health indicators, compare them with documented references and with their own baseline, understand how they relate to NASA's five hazards, and know what to do and when to involve the medical team — even without a link to Earth.</p>
      <h3>Data honesty</h3><ul><li><span class="badge b-real">REAL</span> NASA OSDR Inspiration4 lab data (OSD-575, OSD-569) in the NASA Data view.</li><li><span class="badge b-syn">SYNTHETIC</span> All crew vital signs in the demo are generated by a seeded algorithm to show a realistic scenario (sleep decline, rising fatigue, one low SpO2 reading, a missing day, a typing error). They are not astronaut measurements.</li><li>Reference ranges come from published guidelines (below). Rules marked "engine convention" are engineering choices, not clinical thresholds.</li></ul>
      <h3>Not a medical device</h3><p class="muted">ASTRA VITAL does not diagnose disease and does not replace flight surgeons or official protocols. Suggested actions are conservative and general.</p>
      <h3>Use of AI</h3><p class="muted">The health engine is rule-based; no machine-learning model runs in the app. The team used an AI assistant (Claude, by Anthropic) to help write and review code and documentation; all rules and sources were checked by the team.</p></div>
    <div class="card"><h2>References</h2>${Object.entries(E.SOURCES).map(([k, s]) => `<div class="ref">${esc(s)}</div>`).join('')}
      <div class="ref">NASA Open Science Data Repository — OSD-575 and OSD-569 (SpaceX Inspiration4). https://osdr.nasa.gov/</div>
      <div class="ref">Overbey et al. / Costes et al., "Inspiration4 data access through the NASA Open Science Data Repository", npj Microgravity 10:56 (2024).</div>
      <div class="ref">NASA Space Apps Challenge 2026 — Create Health Monitoring Software for Astronauts on Space Missions.</div>
      <h2 style="margin-top:14px">Team</h2><div class="muted">Etner Therry Rios Vasquez (team owner) · Jeanfranco Alfredo Ibarra Kocfú · Darlin Saldaña Pinedo · Máximo Fabrizzio Espinoza Peche</div></div></div>`;
  };

  /* ---------------- Boot ---------------- */
  S = load() || freshState();
  // keep the synthetic demo current for judges: regenerate if untouched and older than 12 h
  if (!S.records.some(r => r.source !== 'Synthetic demo data') && Date.now() - S.createdAt > 12 * 3600000) S = freshState();
  save();
  // daily routine reset bookkeeping
  if (S.routine.date !== fmtDate(Date.now())) { S.routine = { date: fmtDate(Date.now()), done: [] }; save(); }
  shell(); window.addEventListener('hashchange', route); route();
  window.AV = { get state() { return S; }, engine: E, syncNow, csv, reportHtml };
})();
</script>
</body>
</html>
